name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # Only code that passed CI on main is deployed.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"

      # Render rebuilds the image and the app re-indexes the PDF at startup, so allow ~20 min.
      - name: Smoke test
        env:
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sleep 60
          for i in $(seq 1 40); do
            health=$(curl --fail --silent "$SERVICE_URL/health" || true)
            if echo "$health" | grep -q '"ready":true' && echo "$health" | grep -q "$DEPLOYED_SHA"; then
              echo "Deployed $DEPLOYED_SHA is up"
              exit 0
            fi
            sleep 30
          done
          echo "Service did not become healthy in time"
          exit 1

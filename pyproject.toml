[tool.bt-ai]
runner = "venv"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "gitlint-core>=0.19.1",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    # ANTLR-generated parser code
    "**/*Lexer.py",
    "**/*Parser.py",
    "**/*Listener.py",
    "**/*Visitor.py",
    "**/grammars_*/**",
    # Protobuf / gRPC generated stubs
    "**/*_pb2.py",
    "**/*_pb2_grpc.py",
    # Database migrations (Django, Alembic)
    "**/migrations/**",
    "**/alembic/versions/**",
    # Common build / vendored locations
    "build/**",
    "dist/**",
    "**/vendor/**",
    "**/_generated/**",
]

[tool.ruff.lint]
select = [
    "E", "F",
    "B",
    "S",
    "N",
    "C90",
    "PL",
    "W",
    "D",
    "I",
    "UP",
]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
# B104 (binding 0.0.0.0): deploy-time concern — intentional inside containers,
# noisy in dev. The /bt-ai:security skill already classifies it as BLOCKED to
# prevent automatic rewrites; skipping here keeps it out of dev-time output too.
# B101 (assert) is per-file-ignored to tests/** by ruff's S101 instead, since
# bandit's whole-tree exclude on `tests` already covers that case here.
skips = ["B104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --strict-markers --strict-config"
